<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prisma Studio</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <aside class="lateral">
      <div class="marca"><img src="/logo.svg" alt="" width="34" height="34"><div><strong>Prisma</strong><span>Studio</span></div></div>
      <nav id="menu">
        <button data-vista="criar" class="ativo"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z M4 16l5-5 4 4 3-3 4 4"/></svg>Criar imagem</button>
        <button data-vista="video"><svg viewBox="0 0 24 24"><path d="M3 6h13v12H3z M16 10l5-3v10l-5-3"/></svg>Criar vídeo</button>
        <button data-vista="fundo"><svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8z M5 21c0-4 3-7 7-7s7 3 7 7"/></svg>Remover fundo</button>
        <button data-vista="ampliar"><svg viewBox="0 0 24 24"><path d="M4 9V4h5 M20 15v5h-5 M4 4l6 6 M20 20l-6-6"/></svg>Ampliar</button>
        <button data-vista="galeria"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z"/></svg>Galeria</button>
      </nav>
      <div class="rodape">
        <div id="estado" class="estado"><i class="ponto"></i><span>Iniciando…</span></div>
        <button id="sair" class="sutil" title="Fecha o app e libera a placa de vídeo">Encerrar o Prisma</button>
      </div>
    </aside>
    <main id="conteudo"></main>
  </div>

  <div id="luz" class="luz" hidden></div>
  <div id="aviso" class="aviso" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
